[package]
name = "sshkm-core"
description = "Core library for managing local SSH keys"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "p256", "p384", "encryption", "getrandom", "std"] }
thiserror = "2"
dirs = "6"
trash = "5"
tempfile = "3"
