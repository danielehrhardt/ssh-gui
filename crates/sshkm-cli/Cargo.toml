[package]
name = "sshkm"
description = "Manage your local SSH keys from the terminal — with a built-in MCP server for AI assistants"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "sshkm"
path = "src/main.rs"

[dependencies]
sshkm-core.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
rpassword = "7"

[dev-dependencies]
tempfile = "3"
